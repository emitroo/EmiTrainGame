name: Browser tests

# Simulated phones (Pixel/iPhone profiles in headless Chromium) play real games through the UI.
# Online tests use the public PeerJS server (0.peerjs.com), exactly as the deployed game does.

on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'test/e2e/**', 'index.html', '.github/workflows/e2e.yml']

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the app
        run: |
          mkdir -p "$OUT"
          python3 -m http.server 8765 > /dev/null 2>&1 &
          sleep 1
          curl -sf http://localhost:8765/ > /dev/null
      - name: One phone, 2 people + 1 CPU, Europe
        run: node test/e2e/one-phone.js europe 2 3
      - name: Landscape phone, Switzerland
        if: always()
        run: LANDSCAPE=1 node test/e2e/one-phone.js switzerland 1 3
      - name: One phone vs CPUs on the other maps
        if: always()
        run: |
          node test/e2e/one-phone.js usa 1 5
          node test/e2e/one-phone.js nordic 1 3
          node test/e2e/one-phone.js switzerland 1 3
          node test/e2e/one-phone.js india 1 4
      - name: Online, two phones + CPU
        if: always()
        run: node test/e2e/two-phones.js online
      - name: Online through the TURN relay only
        if: always()
        run: node test/e2e/two-phones.js online relay
      - name: Online reconnect after a page reload
        if: always()
        run: node test/e2e/reconnect.js
      - name: Nearby QR pairing, two phones + CPU
        if: always()
        run: node test/e2e/two-phones.js nearby
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e-out/*.png
